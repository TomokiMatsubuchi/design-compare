name: Release

# main に取り込まれた変更（コミット）が一定数たまったら npm へ自動リリースする。
# 発火元は ci.yml の成功に限定し、公開前のテスト工程をここで重複させない。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # Trusted Publishing（OIDC）で npm に publish するための OIDC トークン発行を許可する。
  # 長期トークン（NPM_TOKEN）は 2027 年 1 月に直接公開できなくなるため、シークレットを使わない。
  id-token: write

# リリース処理は同時に 1 本だけ走らせる（版の取り違えとタグの二重作成を防ぐ）。
concurrency:
  group: release
  cancel-in-progress: false

env:
  # 前回リリース以降の変更がこの件数以上になったら公開する。
  RELEASE_CHANGE_THRESHOLD: "10"

jobs:
  release:
    # 発火元を「main への push から成功した CI」と「main 上の手動実行」に限定する。
    # PR 由来の CI 完了（フォークを含む）で第三者コードを checkout・実行させないための条件。
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run は CI が検証した head_sha、workflow_dispatch は常に main を対象にする。
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: |
          set -euo pipefail
          # Trusted Publishing（OIDC）は npm 11.5.1 以降が必要なので明示的に上げる。
          npm install -g npm@latest
          npm --version

      - name: Count changes since the last release
        id: count
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          git fetch --quiet origin main
          # CI 完了からここまでの間に main が進むと、detached HEAD からの push は non-fast-forward で失敗する。
          # 公開だけ成立してタグが付かない事故を避けるため、分岐を検出したら何もせず終了する。
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HEAD $(git rev-parse --short HEAD) is behind origin/main; skipping this run. The CI run for the latest main commit releases these changes."
            exit 0
          fi
          last_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$last_tag" ]; then
            base=$last_tag
          else
            base="the first commit"
          fi
          changes=$(git rev-list --count "${last_tag:+$last_tag..}HEAD")
          echo "changes=$changes" >> "$GITHUB_OUTPUT"
          echo "Changes since ${base}: $changes (threshold: ${RELEASE_CHANGE_THRESHOLD})"
          if [ "$changes" -lt "$RELEASE_CHANGE_THRESHOLD" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only $changes change(s) since ${base}; nothing to release yet (threshold: ${RELEASE_CHANGE_THRESHOLD})."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute the next version
        id: version
        if: steps.count.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          # package.json と npm の最新公開版のうち大きい方を基準にパッチを上げる。
          # 公開だけ成功してタグ付けに失敗した場合でも、公開済みの版を飛ばして進める。
          current=$(node -p "require('./package.json').version")
          published=$(npm view design-compare version 2>/dev/null || echo "0.0.0")
          next=$(node -e '
            const parse = (value) => value.split(".").map((part) => Number.parseInt(part, 10) || 0);
            const [local, remote] = process.argv.slice(1).map(parse);
            let index = 0;
            while (index < 3 && local[index] === remote[index]) index++;
            const base = index < 3 && local[index] > remote[index] ? local : remote;
            base[2] += 1;
            console.log(base.join("."));
          ' "$current" "$published")
          echo "current=$current (npm: $published)"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          npm version "$next" --no-git-tag-version --allow-same-version >/dev/null
          # 版番号を持つファイルは package.json だけではないため、すべて同じ値に揃える。
          sed -i "s/^version: .*/version: $next/" plugin.yaml
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            const write = (file, mutate) => {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              mutate(json);
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            };
            write(".codex-plugin/plugin.json", (json) => { json.version = version; });
            // marketplace の最上位 version は形式の版なので触らず、配布プラグインの版だけ更新する。
            for (const file of [".claude-plugin/marketplace.json", ".codex-plugin/marketplace.json", ".agents/plugins/marketplace.json"]) {
              write(file, (json) => { json.plugins[0].version = version; });
            }
          ' "$next"
          echo "Next release version: $next"

      - name: Publish to npm
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Trusted Publishing ではシークレットを使わず、GitHub の OIDC トークンで認証する。
          # 先に公開し、成功したときだけタグを付ける（レジストリとタグのずれを避ける）。
          npm publish
          echo "Published design-compare@${VERSION}"

      - name: Tag and commit the release
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json plugin.yaml .codex-plugin/plugin.json \
            .claude-plugin/marketplace.json .codex-plugin/marketplace.json \
            .agents/plugins/marketplace.json
          git commit -m "chore: release v${VERSION} [skip ci]"
          # 版の計算からここまでの間に main が進んでいても push できるように追従する。
          # タグは rebase 後のコミットに付けるため、追従してからタグを打つ。
          git pull --rebase origin main
          git tag "v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"

      - name: Create the GitHub release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
